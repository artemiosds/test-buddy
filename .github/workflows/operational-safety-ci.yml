name: Validar segurança operacional e dashboard

on:
  push:
    branches: [main]
    paths:
      - "src/lib/central-comando-resumo*"
      - "src/components/dashboard/**"
      - "src/lib/frequencia-status-sincronizacao*"
      - "src/lib/cobranca-folhas*"
      - "src/lib/cobranca-correcao*"
      - "src/lib/prazo-envio-etapas*"
      - "src/routes/api/public/hooks/deadline-check.ts"
      - "src/lib/auditoria-inteligente-folhas*"
      - "src/components/frequencias/enviar-folha-dialog.tsx"
      - "src/components/aprovacoes/AuditoriaAprovacoesResumo.tsx"
      - "src/routes/_authenticated/aprovacoes.tsx"
      - "src/hooks/use-autosave-folha*"
      - "src/lib/frequencia-sincronizacao.functions.ts"
      - "src/lib/frequencia-escopo-sincronizacao*"
      - "src/lib/frequencias-contratados.functions.ts"
      - "src/lib/frequencias-efetivos.functions.ts"
      - "src/lib/frequencias.functions.ts"
      - "src/lib/competencias.functions.ts"
      - "src/lib/frequencias-retencao.ts"
      - "docs/plano-confiabilidade-frequencias.md"
      - "src/components/piso/piso-conferencia-wizard.tsx"
      - "src/lib/piso-conferencia-diagnostico*"
      - "src/lib/piso-fopag-parser*"
      - "src/lib/piso-conferencia-ministerio*"
      - ".github/workflows/operational-safety-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operational-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Testes e build sem acesso ao banco
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      VITE_SUPABASE_URL: "http://supabase.test"
      VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_test_key"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Validação transitória: package-lock.json atualmente não acompanha package.json.
      # Não gerar nem publicar lockfile nesta execução. Corrigir lock em etapa específica.
      - name: Instalar dependências sem modificar lockfile
        run: npm install --no-package-lock --no-audit --no-fund --legacy-peer-deps
      - name: Regressões críticas
        run: >-
          npx vitest run
          src/lib/central-comando-resumo.test.ts
          src/lib/frequencia-status-sincronizacao.test.ts
          src/lib/frequencia-status-unidade.test.ts
          src/lib/cobranca-folhas.test.ts
          src/lib/cobranca-correcao.test.ts
          src/lib/prazo-envio-etapas.test.ts
          src/lib/auditoria-inteligente-folhas.test.ts
          src/hooks/use-autosave-folha.test.tsx
          src/lib/realtime/frequency-realtime.test.tsx
          src/lib/realtime/invalidation-batch.test.ts
          src/lib/folha-financeira-snapshot.test.ts
          src/lib/frequencia-escopo-sincronizacao.test.ts
          src/lib/piso-conferencia-diagnostico.test.ts
          src/lib/piso-fopag-parser.test.ts
          src/lib/piso-conferencia-ministerio.test.ts
      - name: Compilar aplicação
        run: npm run build
